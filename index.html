<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>出行准备清单</title>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F5F0E8;
    --card-bg: #FFFDF7;
    --primary: #3D5A80;
    --primary-light: #98C1D9;
    --accent: #E07A5F;
    --text: #2C2C2C;
    --text-muted: #888;
    --border: #D9CFC0;
    --shadow: rgba(60,40,10,0.13);
    --tape: rgba(200,220,255,0.55);
    --font: 'Klee One', serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    background-image:
      radial-gradient(ellipse at 20% 20%, rgba(152,193,217,0.18) 0%, transparent 60%),
      radial-gradient(ellipse at 80% 80%, rgba(224,122,95,0.12) 0%, transparent 60%);
  }

  /* ── HEADER ── */
  #app-header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(245,240,232,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1.5px solid var(--border);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 14px;
  }
  #app-header h1 {
    font-size: 1.35rem; font-weight: 600; letter-spacing: .04em;
    color: var(--primary);
    display: flex; align-items: center; gap: 8px;
  }
  #back-btn {
    display: none; align-items: center; gap: 6px;
    background: none; border: 1.5px solid var(--primary);
    color: var(--primary); padding: 5px 13px;
    border-radius: 20px; cursor: pointer; font-family: var(--font);
    font-size: .88rem; transition: all .2s;
  }
  #back-btn:hover { background: var(--primary); color: #fff; }
  #back-btn svg { width:14px;height:14px; }

  /* ── HOME ── */
  #home-view { padding: 32px 28px; max-width: 900px; margin: 0 auto; }
  #home-top {
    display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 26px;
  }
  #home-top h2 { font-size: 1.1rem; color: var(--text-muted); font-weight: 400; }

  /* New Trip Form */
  #new-trip-form {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 16px;
    padding: 22px 24px;
    margin-bottom: 28px;
    display: none;
    gap: 14px;
    flex-wrap: wrap;
    box-shadow: 0 2px 16px var(--shadow);
  }
  #new-trip-form.open { display: flex; }
  #new-trip-form input {
    flex: 1; min-width: 150px;
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 9px 14px; font-family: var(--font); font-size: .95rem;
    background: #FFF; color: var(--text); outline: none;
    transition: border-color .2s;
  }
  #new-trip-form input:focus { border-color: var(--primary); }
  #new-trip-form input[type="date"] { color: var(--text-muted); }
  .form-actions { display:flex; gap:10px; align-items:center; width:100%; }
  .btn-primary {
    background: var(--primary); color: #fff;
    border: none; border-radius: 10px;
    padding: 9px 22px; font-family: var(--font); font-size:.95rem;
    cursor: pointer; transition: all .2s;
  }
  .btn-primary:hover { background: #2d4060; transform: translateY(-1px); }
  .btn-ghost {
    background: none; color: var(--text-muted);
    border: 1.5px solid var(--border); border-radius: 10px;
    padding: 9px 18px; font-family: var(--font); font-size:.95rem;
    cursor: pointer; transition: all .2s;
  }
  .btn-ghost:hover { border-color: #aaa; }
  #add-trip-btn {
    background: var(--accent); color: #fff;
    border: none; border-radius: 10px;
    padding: 9px 22px; font-family: var(--font);
    font-size:.95rem; cursor:pointer; transition: all .2s;
    display: flex; align-items: center; gap: 6px;
  }
  #add-trip-btn:hover { background: #c96448; transform: translateY(-1px); }

  /* Trip Cards */
  #trip-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px,1fr)); gap: 18px; }
  .trip-card {
    background: var(--card-bg);
    border: 1.5px solid var(--border);
    border-radius: 16px; padding: 20px 20px 16px;
    cursor: pointer; position: relative;
    box-shadow: 0 2px 12px var(--shadow);
    transition: transform .2s, box-shadow .2s;
    overflow: hidden;
  }
  .trip-card::before {
    content: ''; position: absolute;
    top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, var(--primary), var(--primary-light));
    border-radius: 16px 16px 0 0;
  }
  .trip-card:hover { transform: translateY(-3px); box-shadow: 0 8px 28px var(--shadow); }
  .trip-card h3 { font-size: 1.05rem; margin-bottom: 10px; color: var(--text); }
  .trip-card .dates { font-size: .82rem; color: var(--text-muted); line-height: 1.7; }
  .trip-card .dates span { display: block; }
  .trip-card .date-label { color: var(--primary); font-weight: 600; margin-right: 5px; }
  .trip-card-del {
    position: absolute; top: 12px; right: 12px;
    background: none; border: none; cursor: pointer;
    opacity: 0; transition: opacity .2s;
    padding: 4px;
  }
  .trip-card:hover .trip-card-del { opacity: 1; }
  .trip-card-del svg { width:16px;height:16px; color: #bbb; }
  .trip-card-del:hover svg { color: var(--accent); }
  .empty-state {
    grid-column: 1/-1; text-align: center;
    padding: 60px 20px; color: var(--text-muted); font-size: .95rem;
  }
  .empty-state .big { font-size: 3rem; margin-bottom: 12px; }

  /* ── DETAIL VIEW ── */
  #detail-view { display: none; padding: 0; }
  #detail-view.active { display: block; }

  /* Countdown Banner */
  #countdown-banner {
    background: linear-gradient(135deg, var(--primary) 0%, #2d4a70 100%);
    color: #fff; padding: 18px 28px;
    display: flex; align-items: center; gap: 20px;
    flex-wrap: wrap;
  }
  #countdown-icon { width: 64px; height: 64px; flex-shrink: 0; }
  #countdown-text { flex: 1; }
  #countdown-label { font-size: .82rem; opacity: .75; margin-bottom: 3px; }
  #countdown-time {
    font-size: 1.8rem; font-weight: 600; letter-spacing: .06em;
    font-variant-numeric: tabular-nums;
  }
  #countdown-tz { font-size: .75rem; opacity: .6; margin-top: 2px; }
  #progress-area { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
  #progress-text { font-size: .82rem; opacity: .8; }
  #progress-bar-wrap {
    width: 160px; height: 8px;
    background: rgba(255,255,255,.2); border-radius: 4px; overflow: hidden;
  }
  #progress-bar {
    height: 100%; background: #E8F4D4;
    border-radius: 4px; transition: width .4s ease;
  }

  /* Tabs */
  #tab-bar {
    display: flex; gap: 0;
    background: var(--bg); border-bottom: 1.5px solid var(--border);
    padding: 0 28px;
  }
  .tab-btn {
    padding: 12px 24px; font-family: var(--font); font-size: .95rem;
    background: none; border: none; cursor: pointer; color: var(--text-muted);
    border-bottom: 2.5px solid transparent; margin-bottom: -1.5px;
    transition: all .2s;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); font-weight: 600; }
  .tab-btn:hover:not(.active) { color: var(--text); }

  /* Board */
  #board-area { padding: 24px 28px; max-width: 1200px; margin: 0 auto; }
  #add-note-btn {
    margin-bottom: 22px;
    background: none;
    border: 2px dashed var(--primary-light);
    border-radius: 12px; padding: 10px 22px;
    font-family: var(--font); font-size: .92rem;
    color: var(--primary); cursor: pointer;
    transition: all .2s; display: flex; align-items: center; gap: 7px;
  }
  #add-note-btn:hover { background: rgba(61,90,128,.06); border-color: var(--primary); }
  #notes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px,1fr));
    gap: 20px; align-items: start;
  }
  .note-card { word-break: break-word; overflow-wrap: break-word; }

  /* ── STICKY NOTE ── */
  .note-card {
    position: relative;
    border-radius: 3px;
    padding: 36px 20px 32px;
    font-family: var(--font);
    filter: drop-shadow(2px 4px 10px rgba(60,40,10,.15));
    transition: filter .2s;
    /* horizontal lines texture via repeating-linear-gradient */
    background-image:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 23px,
        rgba(0,0,0,.05) 23px,
        rgba(0,0,0,.05) 24px
      );
  }
  .note-card:hover { filter: drop-shadow(3px 6px 16px rgba(60,40,10,.22)); }

  /* tape strip at top */
  .note-tape {
    position: absolute; top: -7px; left: 50%; transform: translateX(-50%);
    width: 44px; height: 20px;
    background: var(--tape);
    border-radius: 2px;
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    pointer-events: none;
  }

  /* curl bottom-right – added via appendChild */
  .note-curl {
    position: absolute; bottom: 0; right: 0;
    width: 28px; height: 28px;
    pointer-events: none;
  }

  .note-title-wrap { margin-bottom: 10px; position: relative; }
  .note-title {
    font-size: .97rem; font-weight: 600;
    width: 100%; background: none; border: none;
    font-family: var(--font); cursor: text; outline: none;
    border-bottom: 1.5px dashed transparent;
    padding: 2px 24px 2px 2px;
    transition: border-color .2s;
    line-height: 1.4;
    word-break: break-all;
  }
  .note-title:focus { border-bottom-color: rgba(0,0,0,.2); }
  .note-del-btn {
    position: absolute; top: 0; right: 0;
    background: none; border: none; cursor: pointer; padding: 3px;
    opacity: .35; transition: opacity .2s;
  }
  .note-del-btn:hover { opacity: .9; }
  .note-del-btn svg { width:14px;height:14px; }

  /* Tasks */
  .task-list { list-style: none; margin-bottom: 10px; }
  .task-item {
    display: flex; align-items: center; gap: 7px;
    padding: 4px 0;
    font-size: .88rem; line-height: 1.35;
    border-bottom: 1px solid rgba(0,0,0,.04);
  }
  .task-check-btn {
    flex-shrink: 0; width: 18px; height: 18px;
    background: none; border: none; cursor: pointer; padding: 0;
    display: flex; align-items: center; justify-content: center;
  }
  .task-text-wrap { flex: 1; position: relative; min-width: 0; }
  .task-text {
    background: none; border: none; font-family: var(--font);
    font-size: .88rem; width: 100%; outline: none;
    cursor: text; padding: 0; line-height: 1.5;
    transition: color .3s;
    white-space: pre-wrap;
    word-break: break-all;
    overflow-wrap: break-word;
    display: block;
  }
  .task-text.done { color: rgba(0,0,0,.35); }
  /* strikethrough animation */
  .task-text-wrap::after {
    content: '';
    position: absolute; top: 50%; left: 0; right: 100%;
    height: 1.5px; background: currentColor;
    transition: right .5s ease; opacity: .5;
    transform: translateY(-50%);
  }
  .task-text-wrap.done::after { right: 0; }
  .task-date {
    font-size: .73rem; opacity: .5; flex-shrink: 0; white-space: nowrap;
  }
  .task-date-input {
    font-size: .73rem; opacity: .6; flex-shrink: 0;
    background: none; border: none; font-family: var(--font);
    cursor: pointer; outline: none; padding: 0;
    width: 100px; min-width: 100px;
  }
  .task-edit-btn, .task-del-btn {
    flex-shrink: 0; width: 0; height: 18px; overflow: hidden;
    background: none; border: none; cursor: pointer; padding: 0;
    opacity: 0; transition: opacity .2s, width .15s;
    display: flex; align-items: center; justify-content: center;
  }
  .task-item:hover .task-edit-btn,
  .task-item:hover .task-del-btn { width: 18px; padding: 1px; }
  .task-item:hover .task-edit-btn,
  .task-item:hover .task-del-btn { opacity: .5; }
  .task-edit-btn:hover, .task-del-btn:hover { opacity: 1 !important; width: 18px; padding: 1px; }
  .task-edit-btn svg, .task-del-btn svg { width: 12px; height: 12px; }

  /* Add task row */
  .add-task-row {
    display: flex; gap: 6px; margin-top: 4px;
  }
  .add-task-input {
    flex: 1; background: rgba(255,255,255,.4);
    border: 1px solid rgba(0,0,0,.12); border-radius: 6px;
    padding: 5px 8px; font-family: var(--font); font-size: .85rem;
    outline: none; transition: border-color .2s;
  }
  .add-task-input:focus { border-color: rgba(0,0,0,.3); }
  .add-task-btn {
    background: rgba(0,0,0,.08); border: none; border-radius: 6px;
    padding: 5px 9px; cursor: pointer; font-family: var(--font);
    font-size: .85rem; transition: background .2s;
    display: flex; align-items: center;
  }
  .add-task-btn:hover { background: rgba(0,0,0,.15); }
  .add-task-btn svg { width:13px;height:13px; }

  /* Loading overlay */
  #loading {
    position: fixed; inset: 0; z-index: 999;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
    transition: opacity .4s;
  }
  #loading.hidden { opacity: 0; pointer-events: none; }
  #loading p { color: var(--text-muted); font-size: .9rem; }
  .spinner {
    width: 36px; height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* SVG animations */
  @keyframes walkLeg {
    0%,100% { transform: rotate(-20deg); }
    50% { transform: rotate(20deg); }
  }
  @keyframes planeFloat {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-4px); }
  }
  @keyframes trailFade {
    0% { opacity: .6; }
    100% { opacity: 0; }
  }
  @keyframes packItem {
    from { opacity:0; transform: translateY(-6px) scale(.7); }
    to { opacity:1; transform: none; }
  }

  /* Responsive */
  @media (max-width: 600px) {
    #home-view, #board-area { padding: 18px 14px; }
    #countdown-banner { padding: 14px 16px; }
    #tab-bar { padding: 0 14px; }
    #countdown-time { font-size: 1.35rem; }
  }
</style>
</head>
<body>

<div id="loading">
  <div class="spinner"></div>
  <p>加载中…</p>
</div>

<!-- ── HEADER ── -->
<header id="app-header">
  <button id="back-btn">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 3L5 8l5 5"/>
    </svg>
    返回
  </button>
  <h1>
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 7H4a2 2 0 00-2 2v10a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2z"/>
      <path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/>
      <line x1="12" y1="12" x2="12" y2="12.01"/>
    </svg>
    出行准备清单
  </h1>
</header>

<!-- ── HOME VIEW ── -->
<div id="home-view">
  <div id="home-top">
    <h2>我的行程</h2>
    <button id="add-trip-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/>
      </svg>
      新建行程
    </button>
  </div>

  <div id="new-trip-form">
    <input id="trip-name-input" type="text" placeholder="行程名称（如：京都五日游）" />
    <input id="trip-depart-input" type="date" />
    <input id="trip-return-input" type="date" />
    <div class="form-actions">
      <button id="save-trip-btn" class="btn-primary">创建行程</button>
      <button id="cancel-trip-btn" class="btn-ghost">取消</button>
    </div>
  </div>

  <div id="trip-list">
    <div class="empty-state">
      <div class="big">✈️</div>
      <p>还没有行程，点击「新建行程」开始吧</p>
    </div>
  </div>
</div>

<!-- ── DETAIL VIEW ── -->
<div id="detail-view">
  <!-- Countdown -->
  <div id="countdown-banner">
    <svg id="countdown-icon" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="countdown-text">
      <div id="countdown-label">距出发还有</div>
      <div id="countdown-time">--:--:--</div>
      <div id="countdown-tz"></div>
    </div>
    <div id="progress-area">
      <div id="progress-text">0 / 0 完成</div>
      <div id="progress-bar-wrap"><div id="progress-bar" style="width:0%"></div></div>
    </div>
  </div>

  <!-- Tabs -->
  <div id="tab-bar">
    <button class="tab-btn active" data-tab="depart">✈️ 出发准备</button>
    <button class="tab-btn" data-tab="return">🏠 回程准备</button>
  </div>

  <!-- Board -->
  <div id="board-area">
    <button id="add-note-btn">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="7" y1="1" x2="7" y2="13"/><line x1="1" y1="7" x2="13" y2="7"/>
      </svg>
      添加便利贴
    </button>
    <div id="notes-grid"></div>
  </div>
</div>

<!-- ── FIREBASE + APP JS ── -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";
import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-analytics.js";
import {
  getFirestore, collection, doc,
  onSnapshot, setDoc, deleteDoc,
  getDocs, writeBatch
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBo3slfRfVtg64I_nCA_WJbwbEA7WFnrz4",
  authDomain: "trip-prepare.firebaseapp.com",
  projectId: "trip-prepare",
  storageBucket: "trip-prepare.firebasestorage.app",
  messagingSenderId: "233221673169",
  appId: "1:233221673169:web:2e98d943c71050e00835f0",
  measurementId: "G-46LDWWVHFS"
};

const fbApp = initializeApp(firebaseConfig);
const analytics = getAnalytics(fbApp);
const db = getFirestore(fbApp);

/* ─── COLOR PALETTE ─── */
const PALS = [
  {bg:'#FEF8C0', color:'#4A3800', curl1:'#E8DA90', curl2:'#C8B860'},
  {bg:'#FCE4EC', color:'#5A1828', curl1:'#EDCADA', curl2:'#C898AE'},
  {bg:'#E9F5EA', color:'#183820', curl1:'#C8E8CA', curl2:'#90C095'},
  {bg:'#E4F0FD', color:'#0A2848', curl1:'#C0D8F5', curl2:'#88B0DC'},
  {bg:'#F3E5F5', color:'#381048', curl1:'#E0C8EC', curl2:'#B090C4'},
  {bg:'#FFF0DE', color:'#402808', curl1:'#EED8B0', curl2:'#C8A878'},
];

/* ─── STATE ─── */
let trips = {};          // { id: {name, departDate, returnDate} }
let currentTripId = null;
let currentTab = 'depart'; // 'depart' | 'return'
let notes = {};           // { id: {title, palIdx, tasks:{id:{text,done,date}}} }
let tripsUnsub = null;
let notesUnsub = null;
let countdownInterval = null;

/* ─── REFS ─── */
const $ = id => document.getElementById(id);
const homeView = $('home-view');
const detailView = $('detail-view');
const backBtn = $('back-btn');
const tripList = $('trip-list');
const addTripBtn = $('add-trip-btn');
const newTripForm = $('new-trip-form');
const tripNameInput = $('trip-name-input');
const tripDepartInput = $('trip-depart-input');
const tripReturnInput = $('trip-return-input');
const saveTripBtn = $('save-trip-btn');
const cancelTripBtn = $('cancel-trip-btn');
const notesGrid = $('notes-grid');
const addNoteBtn = $('add-note-btn');
const countdownIcon = $('countdown-icon');
const countdownLabel = $('countdown-label');
const countdownTime = $('countdown-time');
const countdownTz = $('countdown-tz');
const progressText = $('progress-text');
const progressBar = $('progress-bar');
const loadingEl = $('loading');

/* ─── HELPERS ─── */
function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function fmtDate(d) {
  if (!d) return '';
  const [y,m,day] = d.split('-');
  return `${m}月${day}日`;
}
function pad2(n) { return String(n).padStart(2,'0'); }

/* ─── FIRESTORE ─── */
async function loadTrips() {
  if (tripsUnsub) tripsUnsub();
  const col = collection(db, 'trips');
  tripsUnsub = onSnapshot(col, snap => {
    trips = {};
    snap.forEach(d => { trips[d.id] = d.data(); });
    renderTripList();
  });
}

async function saveTrip(id, data) {
  try {
    await setDoc(doc(db, 'trips', id), data, {merge: true});
    console.log('✅ saveTrip OK', id, data);
  } catch(e) {
    console.error('❌ saveTrip failed:', e.code, e.message);
    alert(`保存失败：${e.message}\n\n请检查 Firestore 安全规则是否允许写入。`);
  }
}
async function removeTrip(id) {
  // Pause the trips listener to avoid rendering intermediate states
  if (tripsUnsub) { tripsUnsub(); tripsUnsub = null; }

  try {
    const batch = writeBatch(db);

    // Queue deletion of all subcollection docs
    const cols = ['notes_depart', 'notes_return'];
    for (const c of cols) {
      const snap = await getDocs(collection(db, 'trips', id, c));
      snap.docs.forEach(d => batch.delete(d.ref));
    }
    // Queue deletion of the trip doc itself
    batch.delete(doc(db, 'trips', id));

    // Commit everything in one round-trip
    await batch.commit();

    // Remove from local state immediately so UI updates at once
    delete trips[id];
    renderTripList();
  } catch(e) {
    console.error('❌ removeTrip failed:', e);
  } finally {
    // Re-subscribe regardless of success/failure
    loadTrips();
  }
}

function getNoteCol(tripId, tab) {
  return collection(db, 'trips', tripId, `notes_${tab}`);
}
async function saveNote(tripId, tab, noteId, data) {
  await setDoc(doc(db,'trips',tripId,`notes_${tab}`,noteId), data, {merge:true});
}
async function removeNote(tripId, tab, noteId) {
  await deleteDoc(doc(db,'trips',tripId,`notes_${tab}`,noteId));
}

function subscribeNotes(tripId, tab) {
  if (notesUnsub) notesUnsub();
  notesUnsub = onSnapshot(getNoteCol(tripId, tab), snap => {
    notes = {};
    snap.forEach(d => { notes[d.id] = d.data(); });
    renderNotes();
    updateProgress();
    updateCountdownIcon();
  });
}

/* ─── RENDER HOME ─── */

    return;

  tripList.innerHTML = '';
  ids.sort((a,b)=> (trips[a].departDate||'') < (trips[b].departDate||'') ? -1:1)
  .forEach(id => {

    card.dataset.id = id;

    const dates = document.createElement('div');
    dates.className = 'dates';
    const d1 = document.createElement('span');

    const d2 = document.createElement('span');

    dates.appendChild(d1); dates.appendChild(d2);

    delBtn.className = 'trip-card-del';
    delBtn.title = '删除行程';

    svg.setAttribute('viewBox','0 0 16 16');
    svg.setAttribute('fill','none');
    svg.setAttribute('stroke','currentColor');
    svg.setAttribute('stroke-width','2');
    svg.setAttribute('stroke-linecap','round');

    p1.setAttribute('x1','3');p1.setAttribute('y1','3');p1.setAttribute('x2','13');p1.setAttribute('y2','13');
    const p2 = document.createElementNS('http://www.w3.org/2000/svg','line');
    p2.setAttribute('x1','13');p2.setAttribute('y1','3');p2.setAttribute('x2','3');p2.setAttribute('y2','13');

/* ─── OPEN TRIP ─── */
function openTrip(id) {
  currentTripId = id;
  currentTab = 'depart';
  homeView.style.display = 'none';
  detailView.style.display = 'block';
  backBtn.style.display = 'flex';

  const t = trips[id];
  document.title = `${t.name} — 出行准备`;

  // Update tab buttons
  document.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.tab === 'depart');
  });

  updateCountdownLabel();
  startCountdown();
  subscribeNotes(id, currentTab);
}

function closeTrip() {
  currentTripId = null;
  if (notesUnsub) { notesUnsub(); notesUnsub = null; }
  if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  homeView.style.display = 'block';
  detailView.style.display = 'none';
  backBtn.style.display = 'none';
  document.title = '出行准备清单';
}

/* ─── COUNTDOWN ─── */
function getTargetDate() {
  if (!currentTripId) return null;
  const t = trips[currentTripId];
  const ds = currentTab === 'depart' ? t.departDate : t.returnDate;
  if (!ds) return null;
  return new Date(ds + 'T00:00:00');
}

function updateCountdownLabel() {
  countdownLabel.textContent = currentTab === 'depart' ? '距出发还有' : '距返程还有';
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  countdownTz.textContent = `时区：${tz}`;
}

function startCountdown() {
  if (countdownInterval) clearInterval(countdownInterval);
  function tick() {
    const target = getTargetDate();
    if (!target) { countdownTime.textContent = '日期未设置'; return; }
    const diff = target - Date.now();
    if (diff <= 0) { countdownTime.textContent = '已出发 🎉'; return; }
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    const s = Math.floor((diff % 60000) / 1000);
    countdownTime.textContent = d > 0
      ? `${d}天 ${pad2(h)}:${pad2(m)}:${pad2(s)}`
      : `${pad2(h)}:${pad2(m)}:${pad2(s)}`;
  }
  tick();
  countdownInterval = setInterval(tick, 1000);
}

/* ─── COUNTDOWN ICON ─── */
function updateCountdownIcon() {
  if (currentTab === 'depart') {
    updateDepartIcon();
  } else {
    updateReturnIcon();
  }
}

function updateDepartIcon() {
  // detect "packing" note and "takeoff" task
  let packingNote = null;
  let allPackDone = false;
  let takeoffDone = false;

  for (const [nid, note] of Object.entries(notes)) {
    const title = (note.title||'').toLowerCase();
    if (/打包|行李|pack|luggage|箱|suitcase/.test(title)) {
      packingNote = note;
      const tasks = Object.values(note.tasks||{});
      if (tasks.length > 0 && tasks.every(t=>t.done)) allPackDone = true;
    }
    for (const task of Object.values(note.tasks||{})) {
      if (/起飞|takeoff|登机|boarding|出发|飞机/.test(task.text||'') && task.done) {
        takeoffDone = true;
      }
    }
  }

  if (takeoffDone) { drawPlaneIcon(); return; }
  if (allPackDone && packingNote) { drawWalkingIcon(); return; }
  if (packingNote) {
    const tasks = Object.values(packingNote.tasks||{});
    const done = tasks.filter(t=>t.done).length;
    drawPackingIcon(done, tasks.length);
    return;
  }
  drawStandingIcon();
}

function updateReturnIcon() {
  // Phase 1: no notes or no shopping note → walking person (heading home)
  // Phase 2: detect "购物|战利品|buy|shop|纪念品|souven" note → fill luggage with items
  // Phase 3: all shopping done → paper plane (return flight)
  let shoppingNote = null;
  let allShopDone = false;
  let returnFlightDone = false;

  for (const [nid, note] of Object.entries(notes)) {
    const title = (note.title||'').toLowerCase();
    if (/购物|战利品|buy|shop|纪念品|souven|购买|伴手礼/.test(title)) {
      shoppingNote = note;
      const tasks = Object.values(note.tasks||{});
      if (tasks.length > 0 && tasks.every(t=>t.done)) allShopDone = true;
    }
    for (const task of Object.values(note.tasks||{})) {
      if (/回程|返程|return|飞机|起飞|登机|boarding/.test(task.text||'') && task.done) {
        returnFlightDone = true;
      }
    }
  }

  if (returnFlightDone) { drawPlaneIcon(); return; }
  if (shoppingNote) {
    const tasks = Object.values(shoppingNote.tasks||{});
    const done = tasks.filter(t=>t.done).length;
    // stay on phase 2 even when all done — only returnFlightDone triggers phase 3
    drawReturnShoppingIcon(done, tasks.length);
    return;
  }
  drawReturnWalkingIcon();
}

/* ─── RENDER NOTES ─── */
function renderNotes() {
  notesGrid.innerHTML = '';
  const sorted = Object.entries(notes).sort((a,b)=> (a[1].createdAt||0)-(b[1].createdAt||0));
  if (sorted.length === 0) {
    const emp = document.createElement('div');
    emp.style.cssText = 'color:var(--text-muted);font-size:.9rem;padding:20px 0;';
    emp.textContent = '还没有便利贴，点击上方按钮添加吧 ✨';
    notesGrid.appendChild(emp);
    return;
  }
  sorted.forEach(([nid, note]) => {
    notesGrid.appendChild(buildNoteEl(nid, note));
  });
}

function buildNoteEl(nid, note) {
  const pal = PALS[note.palIdx || 0];
  const card = document.createElement('div');
  card.className = 'note-card';
  card.dataset.id = nid;
  card.style.backgroundColor = pal.bg;
  card.style.color = pal.color;

  // tape
  const tape = document.createElement('div');
  tape.className = 'note-tape';
  card.appendChild(tape);

  // title row
  const titleWrap = document.createElement('div');
  titleWrap.className = 'note-title-wrap';

  const titleInput = document.createElement('input');
  titleInput.type = 'text';
  titleInput.className = 'note-title';
  titleInput.value = note.title || '便利贴';
  titleInput.style.color = pal.color;
  titleInput.addEventListener('change', () => {
    saveNote(currentTripId, currentTab, nid, {title: titleInput.value});
  });
  titleWrap.appendChild(titleInput);

  const delNoteBtn = document.createElement('button');
  delNoteBtn.className = 'note-del-btn';
  delNoteBtn.title = '删除便利贴';
  delNoteBtn.style.color = pal.color;
  delNoteBtn.appendChild(buildSvgX());
  delNoteBtn.addEventListener('click', () => {
    if (confirm('确认删除这张便利贴？')) removeNote(currentTripId, currentTab, nid);
  });
  titleWrap.appendChild(delNoteBtn);
  card.appendChild(titleWrap);

  // task list
  const taskList = document.createElement('ul');
  taskList.className = 'task-list';
  const tasks = Object.entries(note.tasks||{}).sort((a,b)=>(a[1].order||0)-(b[1].order||0));
  tasks.forEach(([tid, task]) => {
    taskList.appendChild(buildTaskEl(nid, tid, task, pal));
  });
  card.appendChild(taskList);

  // add task row
  const addRow = document.createElement('div');
  addRow.className = 'add-task-row';
  const addInput = document.createElement('input');
  addInput.type = 'text';
  addInput.className = 'add-task-input';
  addInput.placeholder = '新任务…';
  addInput.style.color = pal.color;
  const addBtn = document.createElement('button');
  addBtn.className = 'add-task-btn';
  addBtn.style.color = pal.color;
  addBtn.appendChild(buildSvgPlus());
  const doAdd = () => {
    const txt = addInput.value.trim();
    if (!txt) return;
    if (Object.keys(notes[nid]?.tasks || {}).length >= 15) {
      alert('该便利贴最多15条任务');
      return;
    }
    const tid = uid();
    const updated = { ...(notes[nid]?.tasks || {}), [tid]: { text:txt, done:false, date:'', order: Date.now() } };
    saveNote(currentTripId, currentTab, nid, { tasks: updated });
    addInput.value = '';
  };
  addBtn.addEventListener('click', doAdd);
  addInput.addEventListener('keydown', e => { if (e.key==='Enter') doAdd(); });
  addRow.appendChild(addInput);
  addRow.appendChild(addBtn);
  card.appendChild(addRow);

  // curl – via appendChild, NOT innerHTML+=
  const curl = document.createElement('div');
  curl.className = 'note-curl';
  const curlSvg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  curlSvg.setAttribute('viewBox','0 0 28 28');
  curlSvg.setAttribute('width','28');
  curlSvg.setAttribute('height','28');
  // shadow triangle
  const shadow = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  shadow.setAttribute('points','0,28 28,0 28,28');
  shadow.setAttribute('fill','rgba(0,0,0,.12)');
  curlSvg.appendChild(shadow);
  // curl layer 1
  const c1 = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  c1.setAttribute('points','4,28 28,4 28,28');
  c1.setAttribute('fill', pal.curl1);
  curlSvg.appendChild(c1);
  // curl layer 2
  const c2 = document.createElementNS('http://www.w3.org/2000/svg','polygon');
  c2.setAttribute('points','14,28 28,14 28,28');
  c2.setAttribute('fill', pal.curl2);
  curlSvg.appendChild(c2);
  curl.appendChild(curlSvg);
  card.appendChild(curl);

  return card;
}

function buildTaskEl(nid, tid, task, pal) {
  const li = document.createElement('li');
  li.className = 'task-item';
  li.dataset.tid = tid;

  // checkbox
  const checkBtn = document.createElement('button');
  checkBtn.className = 'task-check-btn';
  checkBtn.style.color = pal.color;
  checkBtn.appendChild(task.done ? buildSvgChecked(pal.color) : buildSvgUnchecked(pal.color));
  checkBtn.addEventListener('click', () => {
    const newDone = !task.done;
    const updated = { ...notes[nid].tasks, [tid]: {...task, done:newDone} };
    saveNote(currentTripId, currentTab, nid, {tasks: updated});
  });
  li.appendChild(checkBtn);

  // text wrap
  const textWrap = document.createElement('div');
  textWrap.className = 'task-text-wrap' + (task.done ? ' done' : '');
  const textInput = document.createElement('textarea');
  textInput.className = 'task-text' + (task.done ? ' done' : '');
  textInput.value = task.text;
  textInput.style.color = pal.color;
  textInput.rows = 1;
  textInput.style.resize = 'none';
  textInput.style.overflow = 'hidden';
  textInput.readOnly = true;
  // auto-height
  const autoHeight = () => {
    textInput.style.height = 'auto';
    textInput.style.height = textInput.scrollHeight + 'px';
  };
  setTimeout(autoHeight, 0);
  textInput.addEventListener('dblclick', () => { textInput.readOnly = false; textInput.focus(); autoHeight(); });
  textInput.addEventListener('input', autoHeight);
  textInput.addEventListener('blur', () => {
    textInput.readOnly = true;
    autoHeight();
    if (textInput.value.trim() !== task.text) {
      const updated = { ...notes[nid].tasks, [tid]: {...task, text:textInput.value.trim()} };
      saveNote(currentTripId, currentTab, nid, {tasks: updated});
    }
  });
  textInput.addEventListener('keydown', e => { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); textInput.blur(); } });
  textWrap.appendChild(textInput);
  li.appendChild(textWrap);

  // date
  const dateInput = document.createElement('input');
  dateInput.type = 'date';
  dateInput.className = 'task-date-input';
  dateInput.value = task.date || '';
  dateInput.title = '截止日期（可选）';
  dateInput.style.color = pal.color;
  dateInput.addEventListener('change', () => {
    const updated = { ...notes[nid].tasks, [tid]: {...task, date: dateInput.value} };
    saveNote(currentTripId, currentTab, nid, {tasks: updated});
  });
  li.appendChild(dateInput);

  // edit btn
  const editBtn = document.createElement('button');
  editBtn.className = 'task-edit-btn';
  editBtn.title = '编辑任务';
  editBtn.style.color = pal.color;
  editBtn.appendChild(buildSvgEdit());
  editBtn.addEventListener('click', () => { textInput.readOnly = false; textInput.focus(); textInput.select(); textInput.style.height = 'auto'; textInput.style.height = textInput.scrollHeight + 'px'; });
  li.appendChild(editBtn);

  // del btn
  const delBtn = document.createElement('button');
  delBtn.className = 'task-del-btn';
  delBtn.title = '删除任务';
  delBtn.style.color = pal.color;
  delBtn.appendChild(buildSvgX());
  delBtn.addEventListener('click', () => {
    const updated = { ...notes[nid].tasks };
    delete updated[tid];
    saveNote(currentTripId, currentTab, nid, {tasks: updated});
  });
  li.appendChild(delBtn);

  return li;
}

/* ─── SVG BUILDERS ─── */
function buildSvgX() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 12 12');
  svg.setAttribute('width','12'); svg.setAttribute('height','12');
  svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','2'); svg.setAttribute('stroke-linecap','round');
  const l1 = document.createElementNS('http://www.w3.org/2000/svg','line');
  l1.setAttribute('x1','2');l1.setAttribute('y1','2');l1.setAttribute('x2','10');l1.setAttribute('y2','10');
  const l2 = document.createElementNS('http://www.w3.org/2000/svg','line');
  l2.setAttribute('x1','10');l2.setAttribute('y1','2');l2.setAttribute('x2','2');l2.setAttribute('y2','10');
  svg.appendChild(l1); svg.appendChild(l2);
  return svg;
}
function buildSvgPlus() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 12 12');
  svg.setAttribute('width','12'); svg.setAttribute('height','12');
  svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','2.2'); svg.setAttribute('stroke-linecap','round');
  const l1 = document.createElementNS('http://www.w3.org/2000/svg','line');
  l1.setAttribute('x1','6');l1.setAttribute('y1','1');l1.setAttribute('x2','6');l1.setAttribute('y2','11');
  const l2 = document.createElementNS('http://www.w3.org/2000/svg','line');
  l2.setAttribute('x1','1');l2.setAttribute('y1','6');l2.setAttribute('x2','11');l2.setAttribute('y2','6');
  svg.appendChild(l1); svg.appendChild(l2);
  return svg;
}
function buildSvgEdit() {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 12 12');
  svg.setAttribute('width','12'); svg.setAttribute('height','12');
  svg.setAttribute('fill','none'); svg.setAttribute('stroke','currentColor');
  svg.setAttribute('stroke-width','1.6'); svg.setAttribute('stroke-linecap','round');
  const p = document.createElementNS('http://www.w3.org/2000/svg','path');
  p.setAttribute('d','M8 2l2 2-6 6H2V8l6-6z');
  svg.appendChild(p);
  return svg;
}
function buildSvgUnchecked(color) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 16 16');
  svg.setAttribute('width','16'); svg.setAttribute('height','16');
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x','2'); rect.setAttribute('y','2');
  rect.setAttribute('width','12'); rect.setAttribute('height','12');
  rect.setAttribute('rx','2.5'); rect.setAttribute('fill','none');
  rect.setAttribute('stroke',color); rect.setAttribute('stroke-width','1.5');
  svg.appendChild(rect);
  return svg;
}
function buildSvgChecked(color) {
  const svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
  svg.setAttribute('viewBox','0 0 16 16');
  svg.setAttribute('width','16'); svg.setAttribute('height','16');
  const rect = document.createElementNS('http://www.w3.org/2000/svg','rect');
  rect.setAttribute('x','2'); rect.setAttribute('y','2');
  rect.setAttribute('width','12'); rect.setAttribute('height','12');
  rect.setAttribute('rx','2.5'); rect.setAttribute('fill',color);
  rect.setAttribute('stroke',color); rect.setAttribute('stroke-width','1.5');
  svg.appendChild(rect);
  const check = document.createElementNS('http://www.w3.org/2000/svg','polyline');
  check.setAttribute('points','5,8 7,10.5 11,6');
  check.setAttribute('fill','none'); check.setAttribute('stroke','white');
  check.setAttribute('stroke-width','1.8'); check.setAttribute('stroke-linecap','round');
  svg.appendChild(check);
  return svg;
}

/* ─── PROGRESS ─── */
function updateProgress() {
  let total = 0, done = 0;
  for (const note of Object.values(notes)) {
    for (const task of Object.values(note.tasks||{})) {
      total++; if (task.done) done++;
    }
  }
  progressText.textContent = `${done} / ${total} 完成`;
  progressBar.style.width = total > 0 ? `${Math.round(done/total*100)}%` : '0%';
}

/* ─── EVENTS ─── */
addTripBtn.addEventListener('click', () => {
  if (Object.keys(trips).length >= 15) {
    alert('最多创建15个行程，无法继续新增');
    return;
  }
  newTripForm.classList.toggle('open');
  if (newTripForm.classList.contains('open')) tripNameInput.focus();
});
cancelTripBtn.addEventListener('click', () => {
  newTripForm.classList.remove('open');
  tripNameInput.value = ''; tripDepartInput.value = ''; tripReturnInput.value = '';
});
saveTripBtn.addEventListener('click', () => {
  console.log('🟡 saveTripBtn clicked');
  const name = tripNameInput.value.trim();
  console.log('🟡 name =', JSON.stringify(name));
  if (!name) { tripNameInput.focus(); return; }
  const id = uid();
  console.log('🟡 calling saveTrip with id=', id);
  saveTrip(id, {
    name, departDate: tripDepartInput.value,
    returnDate: tripReturnInput.value, createdAt: Date.now()
  }).then(() => {
    console.log('✅ saveTrip resolved');
  }).catch(e => {
    console.error('❌ saveTrip rejected:', e);
  });
  newTripForm.classList.remove('open');
  tripNameInput.value = ''; tripDepartInput.value = ''; tripReturnInput.value = '';
});

backBtn.addEventListener('click', closeTrip);

document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    currentTab = btn.dataset.tab;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    updateCountdownLabel();
    startCountdown();
    subscribeNotes(currentTripId, currentTab);
    updateCountdownIcon();
  });
});

addNoteBtn.addEventListener('click', () => {
  if (Object.keys(notes).length >= 15) {
    alert('当前分组最多15张便利贴');
    return;
  }
  const nid = uid();
  const palIdx = Object.keys(notes).length % PALS.length;
  saveNote(currentTripId, currentTab, nid, {
    title: '便利贴', palIdx, tasks: {}, createdAt: Date.now()
  });
});

/* ─── INIT ─── */
async function init() {
  try {
    console.log('🟡 init: starting loadTrips');
    await loadTrips();
    console.log('🟡 init: loadTrips done, trips =', trips);
    drawStandingIcon();
    loadingEl.classList.add('hidden');
    console.log('✅ App initialized, Firebase connected');
  } catch(e) {
    console.error('❌ Init failed:', e.code, e.message, e);
    loadingEl.querySelector('p').textContent = `初始化失败：${e.message}`;
  }
}

init();
</script>
